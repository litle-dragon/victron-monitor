<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victron монітор</title>
<!--
  Local monitor for a Victron MultiPlus-II GX (and any GX device on Venus OS).
  No external dependencies: works without internet, needs only LAN access to the GX.

  On the GX enable: Settings → Services (newer firmware: Settings → Integrations) → MQTT
  (LAN access, plaintext). The page connects over MQTT-over-WebSocket: ws://<GX IP>:9001
  (newer Venus OS also serves ws://<GX IP>/websocket-mqtt).

  It can be hosted on the GX itself (see deploy-to-gx.ps1): then it opens as http://<GX IP>/monitor/
  from any phone/tablet and connects to that GX by itself.

  Quick start: victron-monitor.html?host=192.168.1.50   or   victron-monitor.html?demo=1
  Wall mode (tablet): add &wall=1, e.g. victron-monitor.html?host=192.168.1.50&wall=1
-->
<style>
:root{
  --bg:#0e1317;--card:#161e25;--line:#25313c;--fg:#e6edf3;--mut:#8b98a5;
  --ok:#3fb950;--warn:#d29922;--bad:#f85149;--chg:#3fb950;--dis:#f0883e;--acc:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:600;font-size:17px}
.conn{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.conn.ok .dot{background:var(--ok)} .conn.wait .dot{background:var(--warn)} .conn.bad .dot{background:var(--bad)}
.sp{flex:1}
button{background:#21303d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#04111f;border-color:var(--acc);font-weight:600}
.langsel{background:#21303d;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.lbl{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:44px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.15;margin:6px 0 4px;white-space:nowrap}
.mid{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0 2px;white-space:nowrap}
.sub{color:var(--mut);font-size:13px;min-height:1.4em}
.hero{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.etaf .big,#soc{white-space:normal}
.etaf .big>span,#soc>span{white-space:nowrap;display:inline-block}
.rate{font-size:.45em;font-weight:500;opacity:.85;margin-left:.35em}
.etaf.chg .big{color:var(--chg)} .etaf.dis .big{color:var(--dis)}
.etaf.dis{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.etaf.fc{opacity:.6}                                 /* the "what if" forecast is dimmed */
.etacard.chg{border-color:var(--chg)} .etacard.dis{border-color:var(--dis)}
.bar{position:relative;height:12px;border-radius:6px;background:#0b1014;border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
#socBar{height:100%;width:0;background:var(--ok);transition:width .6s,background .6s}
#invBar,#gridBar{height:100%;width:0;background:var(--ok);transition:width .6s,background .6s}
#gridLoad:empty{display:none}
.tile.hot{border-color:var(--bad)}
#resMark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad);left:0;display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.tile.bad{border-color:var(--bad)} .tile.bad .mid{color:var(--bad)}
.tile.good .mid{color:var(--ok)}
canvas{width:100%;height:180px;display:block;margin-top:8px}
.legend{display:flex;gap:16px;color:var(--mut);font-size:12px;margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{color:var(--mut);font-size:12px;margin:0}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:#0009}
dialog h2{margin:0 0 12px;font-size:18px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:13px;color:var(--mut)}
.f input{background:#0b1014;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;width:100%}
.f small{color:var(--mut);font-size:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.etarow{display:flex;gap:14px;align-items:center}
.etamain{flex:1;min-width:0}
@media (max-width:820px){.hero{grid-template-columns:1fr}.big{font-size:38px}}
/* phone: the two times stack under each other */
@media (max-width:560px){
  body:not(.wall) .etarow{flex-direction:column;align-items:stretch}
  body:not(.wall) .etaf .big>.rate{display:block;margin-left:0}
}
[hidden]{display:none!important}
dialog{max-height:calc(100vh - 32px);overflow:auto}
dialog h3{font-size:15px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.clock{display:none;font-weight:600;font-variant-numeric:tabular-nums}
.wallonly{display:none}
.wl{font-size:18px}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:50}
#flash.on{animation:fl 2.6s ease-out}
@keyframes fl{0%{opacity:.6}16%{opacity:0}33%{opacity:.6}50%{opacity:0}66%{opacity:.6}100%{opacity:0}}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--card);border:2px solid var(--acc);border-radius:12px;
  padding:12px 20px;font-size:18px;font-weight:600;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 8px 30px #000a;cursor:pointer}

/* ---------- Wall mode ---------- */
body.wall{display:flex;flex-direction:column;height:100vh;overflow:hidden}
body.wall header{border-bottom:0;padding:1.5vh 2vw}
body.wall .brand,body.wall .normalonly{display:none}
body.wall .wallonly{display:inline-block}
body.wall .clock{display:block;font-size:clamp(22px,4vw,60px)}
body.wall .conn{font-size:clamp(13px,1.5vw,20px)}
body.wall main{flex:1;min-height:0;width:100%;max-width:none;padding:0 2vw 2vh;grid-template-rows:minmax(0,1fr) auto}
body.wall .hero{grid-template-columns:1fr 1.35fr;min-height:0}
body.wall .hero .card{display:flex;flex-direction:column;justify-content:center;padding:2vh 2.5vw;min-height:0}
body.wall .lbl{font-size:clamp(13px,1.8vw,26px)}
body.wall .sub{font-size:clamp(13px,1.6vw,24px)}
body.wall #soc{font-size:clamp(48px,min(12vw,22vh),220px)}
body.wall #tDis,body.wall #tChg{font-size:clamp(28px,min(4.4vw,7vh),100px);margin:.05em 0}
body.wall .etaf .lbl{font-size:clamp(12px,1.5vw,22px)}
/* on the wall the bracket (power · %/h) always goes on its own line and captions stay on one line: the card height is predictable in any language */
body.wall .etaf .big>.rate{display:block;margin:0;font-size:.42em}
body.wall .etaf .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.wall .etaf.dis{margin-top:1.2vh;padding-top:1.2vh}
body.wall #soc>.rate{display:block;margin:0 0 .1em;font-size:.3em}
body.wall .bar{height:clamp(12px,2.5vh,30px);border-radius:15px}
body.wall .tiles{grid-template-columns:2fr 1fr}
body.wall .tiles>:not(.wallkeep),body.wall .chartcard,body.wall .note{display:none}
body.wall .mid{font-size:clamp(26px,4.6vw,80px)}
body.wall #toast{font-size:clamp(18px,3vw,44px);top:3vh;padding:2vh 3vw}
@media (orientation:portrait){
  body.wall .hero{grid-template-columns:1fr;grid-auto-rows:1fr}
  body.wall #soc{font-size:clamp(48px,min(18vw,13vh),220px)}
  body.wall #tDis,body.wall #tChg{font-size:clamp(32px,min(9vw,6.5vh),120px)}
}
body.night header,body.night main{filter:brightness(var(--dim,.3))}
</style>
</head>

<script>
'use strict';

/* ---------- Minimal MQTT 3.1.1 client over WebSocket (QoS 0) ---------- */
class MiniMqtt {
  constructor(url, opts) { this.url = url; this.opts = opts || {}; this.buf = new Uint8Array(0); this.pid = 1; }
  connect() {
    const ws = this.ws = new WebSocket(this.url, ['mqtt']);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => this._sendConnect();
    ws.onmessage = e => this._onData(new Uint8Array(e.data));
    ws.onclose = () => { clearInterval(this.ping); if (!this.closing) this.onstate && this.onstate('closed'); };
    ws.onerror = () => {};
  }
  close() { this.closing = true; clearInterval(this.ping); try { this.ws.close(); } catch (e) {} }
  _str(s) { const b = new TextEncoder().encode(s); const o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; }
  _pkt(type, parts) {
    const len = parts.reduce((a, p) => a + p.length, 0);
    const hdr = [type]; let x = len;
    do { let d = x % 128; x = Math.floor(x / 128); if (x > 0) d |= 128; hdr.push(d); } while (x > 0);
    const out = new Uint8Array(hdr.length + len); out.set(hdr, 0);
    let o = hdr.length; for (const p of parts) { out.set(p, o); o += p.length; }
    if (this.ws && this.ws.readyState === 1) this.ws.send(out);
  }
  _sendConnect() {
    const o = this.opts; let flags = 0x02; const payload = [this._str(o.clientId)];
    if (o.username || o.password) { flags |= 0x80; payload.push(this._str(o.username || '')); }
    if (o.password) { flags |= 0x40; payload.push(this._str(o.password)); }
    this._pkt(0x10, [new Uint8Array([0, 4, 77, 81, 84, 84, 4, flags, 0, 60]), ...payload]);
  }
  subscribe(topics) {
    const id = (this.pid++ & 0xffff) || 1;
    const parts = [new Uint8Array([id >> 8, id & 255])];
    for (const t of topics) parts.push(this._str(t), new Uint8Array([0]));
    this._pkt(0x82, parts);
  }
  publish(topic, msg) { this._pkt(0x30, [this._str(topic), new TextEncoder().encode(msg || '')]); }
  _onData(chunk) {
    const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length);
    let pos = 0;
    for (;;) {
      if (b.length - pos < 2) break;
      let mul = 1, len = 0, i = pos + 1, d, ok = true;
      do { if (i >= b.length) { ok = false; break; } d = b[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (!ok || i + len > b.length) break;
      this._handle(b[pos], b.subarray(i, i + len)); pos = i + len;
    }
    this.buf = b.slice(pos);
  }
  _handle(h, body) {
    const type = h >> 4;
    if (type === 2) {
      if (body[1] === 0) {
        this.ping = setInterval(() => { try { this.ws.send(new Uint8Array([0xC0, 0])); } catch (e) {} }, 30000);
        this.onstate && this.onstate('connected');
      } else this.onstate && this.onstate('refused', body[1]);
    } else if (type === 3) {
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = new TextDecoder().decode(body.subarray(2, 2 + tl));
      let p = 2 + tl;
      if (qos > 0) { const a = body[p], c = body[p + 1]; p += 2; if (qos === 1) this.ws.send(new Uint8Array([0x40, 2, a, c])); }
      this.onmessage && this.onmessage(topic, new TextDecoder().decode(body.subarray(p)));
    }
  }
}

/* ---------- UI languages: Ukrainian, English ---------- */
// Each entry is [uk, en]. {x} is substituted from t(key, {x: …}).
const LANGS = ['uk', 'en'];
const TR = {
  // header
  title:        ['Victron монітор', 'Victron monitor'],
  brand:        ['⚡ MultiPlus-II монітор', '⚡ MultiPlus-II monitor'],
  wlTitle:      ['Екран не гасне', 'Screen stays on'],

  sndTitle:     ['Браузер чекає дотику, щоб дозволити звук', 'The browser needs a tap to allow sound'],
  demo:         ['Демо', 'Demo'],
  demoExit:     ['Вийти з демо', 'Exit demo'],
  wallOn:       ['🖥 Настінний режим', '🖥 Wall mode'],
  wallOff:      ['Звичайний вигляд', 'Normal view'],
  fsTitle:      ['На весь екран', 'Full screen'],
  settingsBtn:  ['⚙ Налаштування', '⚙ Settings'],
  // cards
  socLbl:       ['Заряд батареї', 'Battery charge'],
  reserveWord:  ['Резерв', 'Reserve'],
  toFull:       ['До повного заряду', 'Time to full'],
  toEmpty:      ['До розряду', 'Time to empty'],
  disTo:        ['(до {r} %)', '(to {r} %)'],
  gridLbl:      ['Мережа', 'Grid'],
  loadLbl:      ['Навантаження', 'Load'],
  batLbl:       ['Батарея', 'Battery'],
  modeLbl:      ['Режим', 'Mode'],
  chartLbl:     ['Останні 15 хвилин', 'Last 15 minutes'],
  lgChg:        ['заряд батареї', 'battery charging'],
  lgDis:        ['розряд батареї', 'battery discharging'],
  lgLoad:       ['навантаження', 'load'],
  note:         ['Час рахується за згладженим струмом батареї (вікно задається в налаштуваннях): до розряду — від поточного SoC до резерву, до заряду — до 100 %. Прогноз заряду оптимістичний: наприкінці (фаза CV / балансування) струм падає й останні відсотки йдуть довше.', 'Times use the smoothed battery current (the window is set in settings): to empty — from the current SoC down to the reserve, to full — up to 100 %. The charge estimate is optimistic: near the end (CV phase / balancing) the current drops and the last percent take longer.'],

  settingsTitle:['Налаштування', 'Settings'],
  fUrl:         ['Адреса MQTT WebSocket на GX', 'GX MQTT WebSocket address'],
  fUrlHint:     ['Зазвичай ws://<IP GX>:9001. У нових Venus OS також ws://<IP GX>/websocket-mqtt', 'Usually ws://<GX IP>:9001. Newer Venus OS also has ws://<GX IP>/websocket-mqtt'],
  fPortal:      ['VRM Portal ID (необов’язково)', 'VRM Portal ID (optional)'],
  fPortalPh:    ['визначиться сам', 'detected automatically'],
  fUser:        ['Логін (необов’язково)', 'Username (optional)'],
  fPw:          ['Пароль GX (необов’язково)', 'GX password (optional)'],
  fPwHint:      ['Не зберігається', 'Not saved'],
  fCap:         ['Ємність батареї, А·год', 'Battery capacity, Ah'],

// The default address is venus.local. Android phones don't resolve *.local names:
// there the GX IP is set in settings or with the ?host= parameter.
const DEF = { url: 'ws://venus.local:9001', portal: '', user: '', capAh: '', reserve: '', chgPw: '', tau: 60, demo: false,
  wall: false, snd: true, quietNight: true, lowSoc: '', nightFrom: 23, nightTo: 7, nightDim: 30, lang: 'uk' };
function loadCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem('victronMon') || '{}') || {}; } catch (e) {}
  c = Object.assign({}, DEF, c);
  const q = new URLSearchParams(location.search);
  if (q.get('host')) c.url = 'ws://' + q.get('host') + ':9001';
  if (q.get('url')) c.url = q.get('url');
  if (q.has('demo')) c.demo = q.get('demo') !== '0';
  if (q.has('wall')) c.wall = q.get('wall') !== '0';
  if (LANGS.includes(q.get('lang'))) c.lang = q.get('lang');

}

// Which addresses to try. If an address is set in settings, only that one.
// Page served by the GX itself (http(s)://<GX>/monitor/, default port): connect to that GX.
// Otherwise (a file on a PC): venus.local.
function urlList() {
  if (cfg.url !== DEF.url) return [cfg.url];
  const L = location;
  if (/^https?:$/.test(L.protocol) && L.hostname && !L.port) {
    return L.protocol === 'https:' ? ['wss://' + L.host + '/websocket-mqtt']
      : ['ws://' + L.host + '/websocket-mqtt', 'ws://' + L.hostname + ':9001'];
  }
  return [DEF.url];
}

function start(keepHist) {
  stop(keepHist === true);
  OUT = cfg.demo ? {} : loadOut(); prevGrid = null; lowArmed = resArmed = true;
  $('btnDemo').textContent = cfg.demo ? t('demoExit') : t('demo');
  if (cfg.demo) { startDemo(); return; }
  const urls = urlList();
  const idx = urlTry % urls.length, url = urls[idx];
  urlTry = idx + 1;
  setConn('wait', () => t('connecting', { u: url }));
  let m;
  try {
    m = mq = new MiniMqtt(url, { clientId: 'webmon-' + Math.random().toString(16).slice(2, 10), username: cfg.user, password: sessionPw });
  } catch (e) { setConn('bad', () => t('badUrl', { u: url })); return; }
  m.onstate = (s, code) => {
    if (m !== mq) return;
    if (s === 'connected') {
      urlTry = idx;  // after a drop, try the working address first
      if (cfg.portal) usePortal(cfg.portal.trim());
      else { setConn('wait', () => t('findPortal')); m.subscribe(['N/+/system/0/Serial']); }
    } else if (s === 'refused') {
      setConn('bad', () => t('refused', { c: code }) + (code === 4 || code === 5 ? t('needPw') : ''));
    } else if (s === 'closed') {
      const more = idx + 1 < urls.length;
      setConn('bad', () => t('noConn', { u: url }) + (more ? t('tryOther')
        : t('retry5') + (/\.local[:/]/.test(url) ? t('localHint') : '')));
      retryTimer = setTimeout(() => start(true), more ? 300 : 5000);
    }
  };
  m.onmessage = onMsg;
  m.connect();
}

function usePortal(id) {
  portalId = id;
  setConn('wait', () => t('waitData', { id }));
  mq.subscribe([
    `N/${id}/system/0/#`,
    `N/${id}/battery/+/InstalledCapacity`,
    `N/${id}/battery/+/Capacity`,
    `N/${id}/settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit`,
    `N/${id}/vebus/+/Ac/Out/P`,                       // inverter output power
    `N/${id}/vebus/+/Ac/Out/NominalInverterPower`,    // its continuous power rating (MultiPlus-II 48/3000: 2500 W)
    `N/${id}/vebus/+/Alarms/Overload`,                // 0 ok, 1 warning, 2 overload
    // charge current limits (for the "grid is back: how long to charge" forecast)
    `N/${id}/vebus/+/Dc/0/MaxChargeCurrent`,
    `N/${id}/vebus/+/BatteryOperationalLimits/MaxChargeCurrent`,
    `N/${id}/vebus/+/Ac/ActiveIn/CurrentLimit`,
    `N/${id}/vebus/+/Ac/ActiveIn/CurrentLimitIsAdjustable`,
    `N/${id}/battery/+/Info/MaxChargeCurrent`,
    `N/${id}/settings/0/Settings/SystemSetup/MaxChargeCurrent`,
    `N/${id}/settings/0/Settings/CGwacs/MaxChargePower`,
  ]);
  // keepalive: newer Venus OS sends no data without it. The first one asks for a full resend of all values.
  mq.publish(`R/${id}/keepalive`, '');
  mq.publish(`R/${id}/system/0/Serial`, '');
  kaTimer = setInterval(() => mq && mq.publish(`R/${id}/keepalive`, '{"keepalive-options":["suppress-republish"]}'), 30000);
}

function onMsg(topic, payload) {
  const parts = topic.split('/');
  if (parts[0] !== 'N') return;
  if (!portalId) { if (topic.endsWith('/system/0/Serial')) usePortal(parts[1]); return; }
  if (parts[1] !== portalId) return;
  let v = null;
  if (payload) { try { v = JSON.parse(payload).value; } catch (e) {} }
  S[parts.slice(2).join('/')] = v;
  lastMsg = Date.now();
}

let actx = null, toastTimer = null;
function audio() {
  try {
    if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
    if (actx.state === 'suspended') actx.resume().catch(() => {});
  } catch (e) { return null; }
  return actx;
}
function beep(tones, rep) {
  const a = audio(); if (!a) return;
  let t = a.currentTime + 0.05;
  for (let r = 0; r < rep; r++) {
    for (const [f, d] of tones) {
      if (f) {
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.4, t + 0.01);
        g.gain.setValueAtTime(0.4, t + d - 0.03); g.gain.linearRampToValueAtTime(0, t + d);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02);
      }
      t += d;
    }
    t += 0.4;
  }
}
const EV = {

function isNightHour() {
  if (cfg.nightFrom === '' || cfg.nightTo === '') return false;
  const f = +cfg.nightFrom, t = +cfg.nightTo;
  if (!isFinite(f) || !isFinite(t) || f === t) return false;
  const h = new Date().getHours();
  return f < t ? (h >= f && h < t) : (h >= f || h < t);
}

function sumL(prefix) {

  for (const l of ['L1', 'L2', 'L3']) { const v = num(S[`${prefix}/${l}/Power`]); if (v != null) s = (s || 0) + v; }
  return s;
}
function batInsts() {
  const abs = S['system/0/ActiveBatteryService'];
  const m = typeof abs === 'string' && abs.match(/battery\/(\d+)/);
  return m ? [m[1]] : [...new Set(Object.keys(S).map(k => (k.match(/^battery\/(\d+)\//) || [])[1]).filter(Boolean))];
}
function batCapAh() {
  for (const i of batInsts()) {
    const c = num(S[`battery/${i}/InstalledCapacity`]) ?? num(S[`battery/${i}/Capacity`]);
    if (c) return c;
  }
  return null;
}
function vebusInst() {
  const vi = num(S['system/0/VebusInstance']);
  if (vi != null) return vi;
  const k = Object.keys(S).find(k => /^vebus\/\d+\//.test(k));
  return k ? k.split('/')[1] : null;
}
// The current the GX will charge the battery with from the grid: the tightest of the limits it publishes itself.
// load is the current load, W: when the grid returns it also goes through the input and takes from the charger.
function chargeLimit(load) {
  const vi = vebusInst(), bi = batInsts()[0], c = [];
  const add = (v, why) => { v = num(v); if (v != null && v >= 0) c.push({ a: v, why }); };
  add(S['settings/0/Settings/SystemSetup/MaxChargeCurrent'], t('whyDvcc'));           // −1 = off
  if (bi != null) add(S[`battery/${bi}/Info/MaxChargeCurrent`], t('whyBms'));
  if (vi != null) {
    add(S[`vebus/${vi}/Dc/0/MaxChargeCurrent`], t('whyCharger'));
    add(S[`vebus/${vi}/BatteryOperationalLimits/MaxChargeCurrent`], t('whyGx'));
  }
  const essW = num(S['settings/0/Settings/CGwacs/MaxChargePower']);                    // −1 = no limit
  if (essW != null && essW >= 0) add(essW / NOM_V, t('whyEss'));
  const inA = vi == null ? null : num(S[`vebus/${vi}/Ac/ActiveIn/CurrentLimit`]);
  if (inA > 0 && load != null) add(Math.max(0, (inA * 230 - load) * 0.93 / NOM_V), t('whyInput', { a: dc(inA) }));
  return c.length ? c.reduce((m, x) => x.a < m.a - 0.05 ? x : m) : null;
}
// load zones: ≥ 80 % red, 50–80 orange, 30–50 green, < 30 calm blue
const zone = pct => pct >= 80 ? 'bad' : pct >= 50 ? 'dis' : pct >= 30 ? 'ok' : 'acc';
const fmtKw = w => dc(+(w / 1000).toFixed(2)) + ' ' + t('ukW');
function fmtW(w) {
  if (w == null) return '—';
  return Math.abs(w) >= 1000 ? dc((w / 1000).toFixed(2)) + ' ' + t('ukW') : Math.round(w) + ' ' + t('uW');
}
function fmtDur(h) {
  if (!isFinite(h) || h < 0) return '—';
  if (h >= 72) return dc((h / 24).toFixed(1)) + ' ' + t('uDays');
  const m = Math.round(h * 60), hh = Math.floor(m / 60), mm = m % 60;
  if (m === 0) return '< 1 ' + t('uMin');
  return hh ? `${hh} ${t('uH')} ${String(mm).padStart(2, '0')} ${t('uMin')}` : `${mm} ${t('uMin')}`;
}
// nominal battery voltage for Ah → Wh (LiFePO4 16S = 51.2 V)
const NOM_V = 51.2;
function fmtWh(wh) { return wh >= 1000 ? dc((wh / 1000).toFixed(1)) + ' ' + t('ukWh') : Math.round(wh) + ' ' + t('uWh'); }
// big value + a smaller note in brackets
function setBig(el, text, extra) {
  el.textContent = '';
  const a = document.createElement('span'); a.textContent = text; el.append(a);
  if (extra) { const r = document.createElement('span'); r.className = 'rate'; r.textContent = `(${extra})`; el.append(r); }
}
// how many percent of the battery go out/come in per hour
function pctH(amps, capAh) {

}
function fmtAt(h) {
  if (!isFinite(h) || h > 24 * 30) return '';
  const d = new Date(Date.now() + h * 3600e3), now = new Date();
  const tm = d.toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' });
  const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date(now).setHours(0, 0, 0, 0)) / 864e5);
  if (days === 0) return t('atToday', { t: tm });
  if (days === 1) return t('atTomorrow', { t: tm });

}

function tick() {
  const now = Date.now(), dt = Math.min(10, (now - lastTick) / 1000); lastTick = now;
  const soc = num(S['system/0/Dc/Battery/Soc']);
  const I = num(S['system/0/Dc/Battery/Current']);
  const V = num(S['system/0/Dc/Battery/Voltage']);
  let P = num(S['system/0/Dc/Battery/Power']); if (P == null && I != null && V != null) P = I * V;
  const T = num(S['system/0/Dc/Battery/Temperature']);
  const load = sumL('system/0/Ac/Consumption');
  const grid = sumL('system/0/Ac/Grid');
  const src = num(S['system/0/Ac/ActiveIn/Source']);
  const st = num(S['system/0/SystemState/State']);

  // smoothing (exponential, time constant = cfg.tau).
  // The average must not drag the previous mode along, so it starts over:
  //  - when the battery moves between charge / discharge / idle (charging resumed after a pause, grid lost/returned);
  //  - when limits change (input current, DVCC/BMS/charger charge current) or the grid comes or goes:
  //    then for ~30 s the smoothing is short (3 s) while the current settles, then back to normal.
  const stOf = x => x > 1 ? 1 : x < -1 ? -1 : 0;
  if (I != null && emaI != null && stOf(I) !== stOf(emaI)) { emaI = I; emaP = P; kickEma(); }
  const vi0 = vebusInst(), lk = [src === 240, S['settings/0/Settings/SystemSetup/MaxChargeCurrent'],
    vi0 == null ? null : S[`vebus/${vi0}/Ac/ActiveIn/CurrentLimit`], vi0 == null ? null : S[`vebus/${vi0}/Dc/0/MaxChargeCurrent`],
    batInsts().map(b => S[`battery/${b}/Info/MaxChargeCurrent`])[0], S['settings/0/Settings/CGwacs/MaxChargePower']].join('|');
  if (limKey != null && lk !== limKey) kickEma();
  limKey = lk;
  const a = 1 - Math.exp(-dt / (now < emaFastUntil ? 3 : Math.max(1, +cfg.tau || 60)));
  if (I != null) emaI = emaI == null ? I : emaI + a * (I - emaI);
  if (P != null) emaP = emaP == null ? P : emaP + a * (P - emaP);
  if (load != null) emaL = emaL == null ? load : emaL + a * (load - emaL);

  // connection status
  if (!cfg.demo && portalId) {
    if (lastMsg && now - lastMsg < 20000) setConn('ok', () => t('online', { id: portalId }));
    else if (lastMsg) setConn('bad', () => t('stale', { s: Math.round((now - lastMsg) / 1000) }));
  }

  // SoC
  const capAh = (+cfg.capAh > 0) ? +cfg.capAh : batCapAh();
  const essMin = num(S['settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit']);
  const reserve = (cfg.reserve !== '' && cfg.reserve != null && isFinite(+cfg.reserve)) ? +cfg.reserve : (essMin ?? 0);
  setBig($('soc'), soc == null ? '—' : dc(soc.toFixed(soc < 10 ? 1 : 0)) + ' %',
    soc != null && capAh ? fmtWh(capAh * soc / 100 * NOM_V) : '');
  const bar = $('socBar'); bar.style.width = (soc ?? 0) + '%';
  bar.style.background = soc == null ? 'var(--mut)' : soc <= reserve + 5 ? 'var(--bad)' : soc < 40 ? 'var(--warn)' : 'var(--ok)';
  const rm = $('resMark'); rm.style.display = reserve > 0 ? 'block' : 'none'; rm.style.left = reserve + '%';
  const vb = V == null ? '' : dc(V.toFixed(2)) + ' ' + t('uV');
  $('socSub').textContent = [capAh ? t('capTxt', { ah: Math.round(capAh) + ' ' + t('uAh'), wh: fmtWh(capAh * NOM_V) }) : t('capUnknown'),
    reserve ? t('reserveTxt', { r: reserve }) : '', vb].filter(Boolean).join(' · ');
  // forecasts: one card, two fields.
  //  charge    — while charging: from the actual current; otherwise a "grid comes back" forecast from the expected charge current;
  //  discharge — while discharging: from the actual current; otherwise a "grid goes down" forecast at the current house load.
  const TH = 0.3; // A — below this counts as idle
  let dis = '—', disSub = '', chg = '—', chgSub = '', disRate = '', chgRate = '', disFc = false, chgFc = false;
  const mode = soc == null || emaI == null ? 'none' : emaI < -TH ? 'dis' : emaI > TH ? 'chg' : 'idle';
  $('disTo').textContent = reserve > 0 ? t('disTo', { r: reserve }) : '';
  const amp = x => dc(x.toFixed(1)) + ' ' + t('uA');
  if (mode === 'none') disSub = chgSub = t('noData');
  else if (!capAh) disSub = chgSub = t('setCap');
  else {
    // --- charge ---
    if (soc >= 99.5) { chg = t('full'); chgSub = mode === 'chg' ? t('topping') : t('charged'); }
    else if (mode === 'chg') {
      const h = capAh * (100 - soc) / 100 / emaI;
      chg = fmtDur(h); chgRate = (emaP != null ? fmtW(emaP) + ' · ' : '') + pctH(emaI, capAh);
      chgSub = fmtAt(h) + (cfg.wall ? '' : ' · ' + t('chgCur', { a: amp(emaI) }));
    } else {
      // expected charge current: from settings if a power is set; otherwise the tightest of the limits
      // the GX publishes (DVCC, BMS, charger, ESS, input minus load); if there are none, 1500 W
      chgFc = true;
      let A, why;
      const L = +cfg.chgPw > 0 ? null : chargeLimit(load);
      if (+cfg.chgPw > 0) { A = +cfg.chgPw / NOM_V; why = t('whySettings'); }
      else if (L) { A = L.a; why = L.why; }
      else { A = 1500 / NOM_V; why = t('whyNone'); }
      if (A < 0.5) { chg = t('blocked'); chgSub = t('chgBlocked', { why }); }
      else {
        const h = capAh * (100 - soc) / 100 / A;
        chg = fmtDur(h); chgRate = fmtW(A * NOM_V) + ' · ' + pctH(A, capAh);
        chgSub = `${fmtAt(h)} · ${src === 240 ? t('ifGridBack') : t('forecast')}` + (cfg.wall ? '' : ' · ' + why);
      }
    }
    // --- discharge ---
    if (soc <= reserve) { dis = t('reserveVal'); disSub = t('atReserve'); disFc = mode !== 'dis'; }
    else if (mode === 'dis') {
      const h = capAh * (soc - reserve) / 100 / -emaI;
      dis = fmtDur(h); disRate = (emaP != null ? fmtW(-emaP) + ' · ' : '') + pctH(-emaI, capAh);
      disSub = fmtAt(h) + (cfg.wall ? '' : ' · ' + t('disCur', { a: amp(-emaI) }));
    } else if (emaL != null) {
      // the battery gives more than the house takes: inverter efficiency ~92 % + ~20 W for the MultiPlus itself
      disFc = true;
      const w = Math.max(0, emaL) / 0.92 + 20, h = capAh * (soc - reserve) / 100 * NOM_V / w;
      dis = fmtDur(h); disRate = fmtW(w) + ' · ' + pctH(w / NOM_V, capAh);
      disSub = `${fmtAt(h)} · ${src === 240 ? t('forecast') : t('ifGridDrops')}` + (cfg.wall ? '' : ' · ' + t('loadW', { w: fmtW(emaL) }));
    }
  }
  // time in big type + power and %/h smaller in brackets; the "what if" forecast is dimmed
  setBig($('tChg'), chg, chgRate); $('tChgSub').textContent = chgSub; $('fChg').classList.toggle('fc', chgFc);
  setBig($('tDis'), dis, disRate); $('tDisSub').textContent = disSub; $('fDis').classList.toggle('fc', disFc);
  $('cardEta').className = 'card etacard ' + (mode === 'chg' || mode === 'dis' ? mode : '');

  // grid: events and outage log
  const gridOk = (src == null || src === 0) ? null : src !== 240;
  if (gridOk !== null) {
    if (!gridOk && !OUT.lostAt) { OUT.lostAt = now; OUT.approx = prevGrid === null; saveOut(); }
    if (gridOk && OUT.lostAt) {
      OUT.lastDur = now - OUT.lostAt; OUT.lastEnd = now; OUT.lastApprox = !!OUT.approx || prevGrid === null;
      delete OUT.lostAt; delete OUT.approx; saveOut();
    }
    if (prevGrid !== null && gridOk !== prevGrid) {
      if (gridOk) { const d = OUT.lastDur ? outDur(OUT.lastDur, OUT.lastApprox) : ''; alertEv('restore', d ? t('outLasted', { d }) : ''); }
      else alertEv('lost', t('atTime', { t: hhmm(now) }) + (soc != null ? ` · SoC ${Math.round(soc)} %` : ''));
    }
    prevGrid = gridOk;
  }

  // battery running low / at the reserve
  const lowTh = (cfg.lowSoc !== '' && cfg.lowSoc != null && isFinite(+cfg.lowSoc)) ? +cfg.lowSoc : reserve + 10;
  if (soc != null) {
    if (mode === 'dis' && resArmed && reserve > 0 && soc <= reserve + 0.5) { resArmed = lowArmed = false; alertEv('reserve', `SoC ${Math.round(soc)} %`); }
    else if (mode === 'dis' && lowArmed && soc <= lowTh) { lowArmed = false; alertEv('low', `SoC ${Math.round(soc)} %` + (dis !== '—' ? t('lowToEmpty', { d: dis }) : '')); }
    if (soc > lowTh + 3) lowArmed = true;
    if (soc > reserve + 3) resArmed = true;
  }

  // tiles
  const noGrid = gridOk === false;
  $('tGrid').className = 'card tile wallkeep ' + (noGrid ? 'bad' : gridOk ? 'good' : '');
  $('grid').textContent = cfg.wall ? (noGrid ? t('noGridWall') : gridOk ? t('gridWall') : '—') : (noGrid ? t('noGridShort') : fmtW(grid));
  let gs = '';
  if (noGrid) {
    if (OUT.lostAt) {
      const d = outDur(now - OUT.lostAt, OUT.approx);
      gs = (d ? t('noGridFor', { d }) : t('onBattery')) + ' · ' + t(OUT.approx ? 'noticedAt' : 'since', { t: hhmm(OUT.lostAt) });
    } else gs = t('onBattery');
  } else if (gridOk) {
    gs = (cfg.wall ? fmtW(grid) + ' · ' : '') + t('inputSrc', { s: SOURCES[src] ? SOURCES[src][LI] : src }) + (grid != null && grid < -20 ? ' · ' + t('exporting') : '');
    const d = OUT.lastEnd ? outDur(OUT.lastDur, OUT.lastApprox) : '';
    if (d) gs += ' · ' + t('lastOutage', { d, t: hhmm(OUT.lastEnd) });
  }
  $('gridSub').textContent = gs;
  // grid input load: power from the grid / the allowed input power (the GX input current limit × 230 V)
  const viIn = vebusInst();
  const inLim = viIn == null ? null : num(S[`vebus/${viIn}/Ac/ActiveIn/CurrentLimit`]);
  const gridCap = inLim > 0 ? inLim * 230 : null;
  let glvl = '';
  if (gridOk && grid != null && gridCap) {
    const pct = Math.max(0, grid / gridCap * 100);
    glvl = zone(pct);
    $('gridBar').style.width = Math.min(100, pct) + '%';
    $('gridBar').style.background = `var(--${glvl})`;
    $('gridLoad').textContent = t('gridLoadTxt', { p: Math.round(pct), c: fmtKw(gridCap) }) + (pct >= 100 ? t('exceeded') : '');
  } else $('gridLoad').textContent = '';
  $('gridBarBox').hidden = !glvl;
  $('tGrid').classList.toggle('hot', glvl === 'bad');

  // wall mode: clock, night, screen, sound
  $('clock').textContent = new Date().toLocaleTimeString(LOC(), { hour: '2-digit', minute: '2-digit' });
  document.documentElement.style.setProperty('--dim', Math.max(5, Math.min(100, +cfg.nightDim || 30)) / 100);
  document.body.classList.toggle('night', !!cfg.wall && isNightHour() && now > nightWakeUntil);
  keepAwake();
  $('wl').hidden = !(cfg.wall && wakeLock);
  $('sndBadge').hidden = !(cfg.snd && (!actx || actx.state !== 'running'));
  $('load').textContent = fmtW(load);
  // inverter load level: output power / its continuous rating (taken from the GX itself)
  const vi = vebusInst();
  const nom = vi == null ? null : num(S[`vebus/${vi}/Ac/Out/NominalInverterPower`]);
  const outP = (vi == null ? null : num(S[`vebus/${vi}/Ac/Out/P`])) ?? load;
  const ovl = vi == null ? null : num(S[`vebus/${vi}/Alarms/Overload`]);
  let ls = t('acOut'), lvl = '';
  if (nom > 0 && outP != null) {
    const pct = Math.max(0, outP / nom * 100), nomT = fmtKw(nom);
    ls = t(gridOk === false ? 'invLoadBat' : 'invLoadGrid', { p: Math.round(pct), n: nomT });
    lvl = ovl === 2 ? 'bad' : ovl === 1 && zone(pct) !== 'bad' ? 'dis' : zone(pct);
    if (ovl === 2) ls = t('overload') + ls; else if (ovl === 1) ls = t('nearOverload') + ls;
    $('invBar').style.width = Math.min(100, pct) + '%';
    $('invBar').style.background = `var(--${lvl})`;
  }
  $('invBarBox').hidden = !lvl;
  $('load').parentElement.classList.toggle('bad', lvl === 'bad');
  $('loadSub').textContent = ls;
  $('bat').textContent = fmtW(P);
  $('batSub').textContent = [vb, I != null ? amp(I) : '', T != null ? T.toFixed(0) + ' °C' : ''].filter(Boolean).join(' · ');
  $('state').textContent = st == null ? '—' : (STATES[st] ? STATES[st][LI] : t('stateCode', { c: st }));

  // history
  if (now - lastHist >= 5000 && (P != null || load != null)) {
    lastHist = now; hist.push({ t: now, p: P, c: load });
    while (hist.length && hist[0].t < now - 15 * 60e3) hist.shift();

  drawChart(now);
}

function drawChart(now) {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const L = 52, R = w - 6, top = 8, bot = h - 18, span = 15 * 60e3;
  let max = 500; for (const p of hist) max = Math.max(max, Math.abs(p.p || 0), Math.abs(p.c || 0));
  max = Math.ceil(max * 1.1 / 500) * 500;
  const X = t => L + (R - L) * (1 - (now - t) / span), Y = v => top + (bot - top) * (max - v) / (2 * max);
  g.font = '11px system-ui'; g.fillStyle = css('--mut'); g.strokeStyle = css('--line'); g.lineWidth = 1;
  for (const v of [max, max / 2, 0, -max / 2, -max]) {
    g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(R, Y(v)); g.stroke();
    g.fillText(fmtW(v), 2, Y(v) + 4);
  }
  for (const m of [15, 10, 5, 0]) g.fillText(m ? `−${m} ${t('uMin')}` : t('now'), Math.min(X(now - m * 60e3) - (m ? 16 : 34), R - 40), h - 3);
  if (hist.length < 2) return;
  const bw = Math.max(1, (R - L) / (span / 5000) - 0.5);
  for (const p of hist) {
    if (p.p == null) continue;
    g.fillStyle = p.p >= 0 ? css('--chg') : css('--dis');
    const y0 = Y(0), y1 = Y(p.p); g.fillRect(X(p.t) - bw, Math.min(y0, y1), bw, Math.abs(y1 - y0) || 1);
  }
  g.strokeStyle = css('--acc'); g.lineWidth = 2; g.beginPath(); let first = true;
  for (const p of hist) { if (p.c == null) continue; const x = X(p.t), y = Y(p.c); first ? g.moveTo(x, y) : g.lineTo(x, y); first = false; }
  g.stroke();
}

/* ---------- Demo mode (simulation) ---------- */
function startDemo() {
  setConn('wait', () => t('demoConn'));
  portalId = 'demo';
  const cap = 100, t0 = Date.now(); let soc = 72, kettleUntil = 0;
  Object.assign(S, { 'system/0/ActiveBatteryService': 'com.victronenergy.battery/512', 'battery/512/InstalledCapacity': cap,
    'settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit': 20,
    // limits are set once: in demo the Limits button changes them here
    'vebus/275/Dc/0/MaxChargeCurrent': 35, 'vebus/275/Ac/ActiveIn/CurrentLimit': 16, 'vebus/275/Ac/ActiveIn/CurrentLimitIsAdjustable': 1,
    'battery/512/Info/MaxChargeCurrent': 100, 'settings/0/Settings/SystemSetup/MaxChargeCurrent': 35,
    'settings/0/Settings/CGwacs/MaxChargePower': -1, 'system/0/Control/Dvcc': true });
  const step = () => {
    const t = (Date.now() - t0) / 1000;
    const gridOn = Math.floor(t / 90) % 2 === 1;           // 90 s with grid, 90 s without
    if (Math.random() < 0.01) kettleUntil = t + 20;
    let load = 450 + 250 * Math.sin(t / 23) + 80 * Math.random() + (t < kettleUntil ? 2000 : 0);
    const pv = Math.max(0, 600 * Math.sin(t / 60));
    const V = 48.5 + soc * 0.045;
    let batP, grid;
    if (gridOn) { batP = soc < 100 ? Math.min(35 * V, 1700) : 0; grid = load + batP - pv; }
    else { batP = -(load - pv) / 0.93; grid = 0; }
    soc = Math.max(0, Math.min(100, soc + batP / V / cap * 100 / 3600 * 20)); // sped up ×20
    Object.assign(S, {
      'system/0/Dc/Battery/Soc': soc, 'system/0/Dc/Battery/Voltage': V, 'system/0/Dc/Battery/Power': batP,
      'system/0/Dc/Battery/Current': batP / V, 'system/0/Dc/Battery/Temperature': 24,
      'system/0/Ac/Consumption/L1/Power': load, 'system/0/Ac/Grid/L1/Power': gridOn ? grid : null,
      'system/0/Dc/Pv/Power': pv, 'system/0/Ac/ActiveIn/Source': gridOn ? 1 : 240,
      'system/0/SystemState/State': gridOn ? (soc < 100 ? 3 : 8) : 9,
      'system/0/VebusInstance': 275, 'vebus/275/Ac/Out/NominalInverterPower': 2500, 'vebus/275/Ac/Out/P': load,
      'vebus/275/Alarms/Overload': load > 2500 ? 2 : load > 2300 ? 1 : 0,
    });
    lastMsg = Date.now();
  };
  step(); demoTimer = setInterval(step, 1000);
}

// language switch: texts change at once, the choice is remembered
$('selLang').onchange = () => {
  cfg.lang = $('selLang').value; LI = Math.max(0, LANGS.indexOf(cfg.lang)); saveCfg();
  applyLang(); applyWall(); tick();
  if (connFn) $('connText').textContent = connFn();
};

applyLang();
applyWall();
if (cfg.snd) audio();   // in a kiosk browser with autoplay allowed, sound works right away
start();
setInterval(tick, 1000);
tick();
</script>
</body>
